<div class="flex flex-col w-full h-full justify-center items-center bg-zinc-300">
    <div class="flex flex-col rounded-2xl w-1/2 min-h-3/4 h-fit bg-white shadow pt-12">
        <app-header
            [task]="task"
            [action]="action"
            (onAddTask)="addTask(task)"
            (onUpdateTask)="updateTask(task)">
        </app-header>

        <div class="w-3/4 h-[1px] bg-black/30 mx-auto mt-5" [class]="tasks.length > 0 ? 'mb-8' : ''"></div>

        <div class="flex w-full flex-col mb-10">
            <app-task-item
                *ngFor="let task of tasks"
                [task]="task"
                (onCompleteTask)="completeTask(task)"
                (onDeleteTask)="deleteTask(task)"
                (onEditTask)="editTask(task)"
                >
            </app-task-item>
        </div>
    </div>
</div>
